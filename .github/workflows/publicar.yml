# Publicación: al empujar una etiqueta vX.Y.Z se ejecutan las pruebas, se construyen los paquetes de escritorio
# para Windows y macOS con PyInstaller, se les hace una prueba de humo en el propio runner (herramientas por
# subcomando, servidor local, importación del caso sintético, comparación SUV y empaquetado) y se crea un
# borrador de GitHub Release con los paquetes, las instrucciones, las notas de la versión y el caso sintético.
# El borrador se publica a mano tras la prueba en Windows 10 y macOS reales.
#
# Release on tag vX.Y.Z: tests, PyInstaller packages for Windows and macOS, smoke test on each runner, and a
# DRAFT GitHub Release with packages, instructions, release notes and the synthetic demo case.
name: publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    name: Pruebas antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pytest --with pydicom --with numpy --with fastapi --with uvicorn --with pillow --with nibabel pytest -q pruebas
      - name: Las notas de esta versión deben existir
        run: test -f "docs/notas-de-version/${GITHUB_REF_NAME}.md" || (echo "Falta docs/notas-de-version/${GITHUB_REF_NAME}.md" && exit 1)

  paquetes:
    name: Paquete ${{ matrix.nombre }}
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest
            nombre: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Construir con PyInstaller
        shell: bash
        run: bash herramientas/empaquetar.sh
      - name: Prueba de humo del ejecutable (herramientas, servidor, importación sintética, SUV, paquete)
        shell: bash
        run: |
          set -euo pipefail
          B="herramientas/dist/PET-CT local/PET-CT local"
          [ -f "$B.exe" ] && B="$B.exe"
          "$B" --version
          "$B" herramienta demo humo/originales/DEMO
          "$B" herramienta anonimizar limpiar humo/originales/DEMO humo/limpios
          "$B" herramienta cotejar humo/originales/DEMO humo/limpios | tail -1 | grep -q COINCIDE
          "$B" herramienta emparejar humo/limpios/ANON-0001 | grep -q "CANDIDATO COMPATIBLE"
          S=$(find humo/limpios -type d -name 'serie_*PT*' | head -1)
          "$B" herramienta suv comparar "$S" | grep -q "Veredicto: IDENTICO"
          "$B" --trabajo humo/app --puerto 8765 --sin-navegador > servidor.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8765/static/app.js && break; sleep 1; done
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8765/static/app.js | grep -q 200
          T=$(grep -o 't=[A-Za-z0-9_-]*' servidor.log | head -1 | cut -c3-)
          curl -s -o /dev/null -w "%{http_code}\n" -H "X-Token: $T" http://127.0.0.1:8765/api/estado | grep -q 200
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8765/api/estado | grep -q 401
      - name: Añadir instrucciones y lanzador al paquete
        shell: bash
        run: |
          cp docs/instalacion.md "herramientas/dist/PET-CT local/LEEME.md"
          if [ "${{ matrix.nombre }}" = "macos" ]; then
            printf '#!/bin/bash\ncd "$(dirname "$0")"\n./"PET-CT local"\n' > "herramientas/dist/PET-CT local/Abrir PET-CT local.command"
            chmod +x "herramientas/dist/PET-CT local/Abrir PET-CT local.command"
            codesign --force --deep --sign - "herramientas/dist/PET-CT local/PET-CT local" || true
          fi
      - name: Comprimir
        shell: bash
        run: |
          cd herramientas/dist
          if [ "${{ matrix.nombre }}" = "windows" ]; then 7z a -tzip "../../PET-CT-local-${GITHUB_REF_NAME}-windows.zip" "PET-CT local" > /dev/null; else zip -qry "../../PET-CT-local-${GITHUB_REF_NAME}-macos.zip" "PET-CT local"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-${{ matrix.nombre }}
          path: PET-CT-local-*.zip
          retention-days: 14

  demo:
    name: Caso sintético de demostración
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run herramientas/demo.py demo-sintetico/DEMO && cd demo-sintetico && zip -qr ../datos-demo-sinteticos.zip DEMO
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: datos-demo-sinteticos.zip
          retention-days: 14

  borrador:
    name: Borrador de la versión
    needs: [paquetes, demo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: adjuntos
      - name: Ningún adjunto puede contener DICOM reales ni archivos privados
        run: |
          cd adjuntos && for z in *.zip; do
            unzip -l "$z" | grep -Ei "mapa_seudonimos|indice_origen|raices.json|corridas.jsonl|revision_pixeles|paquete_[0-9]" && { echo "adjunto con archivos privados: $z"; exit 1; } || true
          done
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: PET-CT local ${{ github.ref_name }}
          body_path: docs/notas-de-version/${{ github.ref_name }}.md
          files: |
            adjuntos/PET-CT-local-*.zip
            adjuntos/datos-demo-sinteticos.zip
            docs/instalacion.md
