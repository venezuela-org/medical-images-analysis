# Publicación: al empujar una etiqueta vX.Y.Z se ejecutan las pruebas, se construyen los paquetes de escritorio
# para Windows y macOS con PyInstaller, se les hace una prueba de humo por la API en el propio runner (servidor
# local, caso sintético, importación, comprobaciones, revisión de píxeles, exportación y verificación del paquete
# resultante), se comprueban los adjuntos por contenido y se crea un borrador de GitHub Release con los paquetes,
# las instrucciones, las notas de la versión y el caso sintético. El borrador se publica a mano tras la prueba en
# Windows 10 y macOS reales. La comprobación de adjuntos demuestra que no hay DICOM fuera de la demo ni archivos
# privados conocidos; no sustituye la revisión manual.
#
# Release on tag vX.Y.Z: tests, PyInstaller packages for Windows and macOS, smoke test on each runner, and a
# DRAFT GitHub Release with packages, instructions, release notes and the synthetic demo case.
name: publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    name: Pruebas antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pytest --with pydicom --with numpy --with fastapi --with uvicorn --with pillow --with nibabel pytest -q pruebas
      - name: Las notas de esta versión deben existir
        run: test -f "docs/notas-de-version/${GITHUB_REF_NAME}.md" || (echo "Falta docs/notas-de-version/${GITHUB_REF_NAME}.md" && exit 1)

  paquetes:
    name: Paquete ${{ matrix.nombre }}
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest
            nombre: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Construir con PyInstaller
        shell: bash
        run: bash herramientas/empaquetar.sh
      - name: Prueba de humo por la API (importación, comprobaciones, revisión, exportación y verificación del paquete)
        shell: bash
        run: |
          B="herramientas/dist/PET-CT local/PET-CT local"
          [ -f "$B.exe" ] && B="$B.exe"
          "$B" --version
          uv run --with pydicom python pruebas/humo_paquete.py --binario "$B" --puerto 8765
      - name: Añadir instrucciones y lanzador al paquete
        shell: bash
        run: |
          cp docs/instalacion.md "herramientas/dist/PET-CT local/LEEME.md"
          if [ "${{ matrix.nombre }}" = "macos" ]; then
            # Lanzador: quita la marca de cuarentena que macOS pone a todo lo descargado (sin ella, Gatekeeper
            # bloquea las bibliotecas del paquete con "Python.framework está dañado") y arranca la aplicación.
            printf '%s\n' '#!/bin/bash' 'cd "$(dirname "$0")"' 'xattr -dr com.apple.quarantine . 2>/dev/null || true' 'exec ./"PET-CT local"' > "herramientas/dist/PET-CT local/Abrir PET-CT local.command"
            chmod +x "herramientas/dist/PET-CT local/Abrir PET-CT local.command"
            # Firma ad hoc de cada binario del paquete (bibliotecas, frameworks y ejecutable), para que las firmas sean válidas
            find "herramientas/dist/PET-CT local/_internal" -type f \( -name "*.dylib" -o -name "*.so" -o -name "Python" \) -exec codesign --force --sign - {} \; 2>/dev/null || true
            find "herramientas/dist/PET-CT local/_internal" -type d -name "*.framework" -exec codesign --force --deep --sign - {} \; 2>/dev/null || true
            codesign --force --sign - "herramientas/dist/PET-CT local/PET-CT local" || true
          fi
      - name: Comprimir
        shell: bash
        run: |
          cd herramientas/dist
          # Nombres sin versión: los botones del README apuntan a releases/latest/download/<nombre> y no cambian con cada versión
          if [ "${{ matrix.nombre }}" = "windows" ]; then 7z a -tzip "../../PET-CT-local-windows.zip" "PET-CT local" > /dev/null; else zip -qry "../../PET-CT-local-macos.zip" "PET-CT local"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-${{ matrix.nombre }}
          path: PET-CT-local-*.zip
          retention-days: 14

  demo:
    name: Caso sintético de demostración
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run herramientas/demo.py demo-sintetico/DEMO && cd demo-sintetico && zip -qr ../datos-demo-sinteticos.zip DEMO
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: datos-demo-sinteticos.zip
          retention-days: 14

  borrador:
    name: Borrador de la versión
    needs: [paquetes, demo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: adjuntos
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Adjuntos comprobados por contenido (ningún DICOM fuera de la demo sintética, ningún archivo privado)
        run: uv run --with pydicom python pruebas/comprobar_adjuntos.py adjuntos/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: PET-CT local ${{ github.ref_name }}
          body_path: docs/notas-de-version/${{ github.ref_name }}.md
          files: |
            adjuntos/PET-CT-local-*.zip
            adjuntos/datos-demo-sinteticos.zip
            docs/instalacion.md
